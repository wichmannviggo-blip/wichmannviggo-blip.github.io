<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GeoBoard — Draft &amp; Construct</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #1A1A1D;
    --bg-deep: #141416;
    --grid: #232326;
    --grid-major: #303035;
    --paper: #E8E8EA;
    --amber: #5B9BFF;
    --amber-dim: #3A6BB0;
    --cyan: #7FD9C4;
    --red: #E2685A;
    --panel: #1E1E21;
    --panel-border: #2C2C30;
    --text-dim: #8A8A90;
  }

  *{
    box-sizing:border-box;
  }

  html,body{
    margin:0;
    height:100%;
    width:100%;
    background:var(--bg-deep);
    font-family:'Inter',sans-serif;
    color:var(--paper);
    overflow:hidden;
    user-select:none;
  }

  #app{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* ---------- Toolbar ---------- */

  #toolbar{
    width:76px;
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:14px 0;
    gap:6px;
    z-index:10;
  }

  .brand{
    font-family:'Inter',sans-serif;
    font-size:9px;
    letter-spacing:0.14em;
    color:var(--text-dim);
    margin-bottom:14px;
    text-align:center;
    line-height:1.3;
  }

  .brand b{
    display:block;
    font-size:13px;
    color:var(--paper);
    font-weight:600;
    letter-spacing:0.01em;
    margin-bottom:2px;
  }

  .tool{
    width:56px;
    height:52px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    background:transparent;
    border:1px solid transparent;
    border-radius:8px;
    cursor:pointer;
    color:var(--text-dim);
    transition:background .12s, color .12s, border-color .12s;
  }

  .tool svg{
    width:20px;
    height:20px;
  }

  .tool span{
    font-size:9px;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.02em;
  }

  .tool:hover{
    background:rgba(111,207,235,0.08);
    color:var(--paper);
  }

  .tool.active{
    background:rgba(232,163,61,0.14);
    border-color:var(--amber-dim);
    color:var(--amber);
  }

  .tool-divider{
    width:40px;
    height:1px;
    background:var(--panel-border);
    margin:6px 0;
  }

  #undo-btn{
    margin-top:auto;
  }

  /* ---------- Controls ---------- */

  #controls{
    width:100%;
    padding:8px 8px 2px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }

  #controls label{
    font-family:'IBM Plex Mono',monospace;
    font-size:8px;
    color:var(--text-dim);
    text-align:center;
  }

  #grid-size{
    width:60px;
    height:28px;
    background:#17171A;
    color:var(--paper);
    border:1px solid var(--panel-border);
    border-radius:6px;
    padding:2px 4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    outline:none;
  }

  #grid-size:focus{
    border-color:var(--amber-dim);
  }

  /* ---------- Canvas ---------- */

  #canvas-wrap{
    flex:1;
    position:relative;
    background-color:var(--bg);
    overflow:hidden;
  }

  svg#board{
    width:100%;
    height:100%;
    cursor:crosshair;
    display:block;
  }

  svg#board.panning{
    cursor:grabbing;
  }

  .grid-line{
    stroke:var(--grid);
    stroke-width:1;
    vector-effect:non-scaling-stroke;
  }

  .grid-major{
    stroke:var(--grid-major);
    stroke-width:1.2;
    vector-effect:non-scaling-stroke;
  }

  .axis-line{
    stroke:var(--panel-border);
    stroke-width:1.4;
    vector-effect:non-scaling-stroke;
  }

  .axis-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    fill:var(--text-dim);
    pointer-events:none;
  }

  .axis-label.origin{
    fill:var(--text-dim);
  }

  .snap-ring{
    fill:none;
    stroke:var(--amber);
    stroke-width:1.6;
    opacity:0.95;
    pointer-events:none;
  }

  .snap-ring.point-snap{
    stroke:var(--cyan);
  }

  .pt{
    fill:var(--paper);
    stroke:var(--bg-deep);
    stroke-width:1.5;
    cursor:grab;
  }

  .pt.hover{
    fill:var(--amber);
  }

  .pt.dragging{
    fill:var(--amber);
    cursor:grabbing;
  }

  .pt-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    fill:var(--cyan);
    pointer-events:none;
  }

  .seg{
    stroke:var(--paper);
    stroke-width:2;
    vector-effect:non-scaling-stroke;
  }

  .circ{
    fill:none;
    stroke:var(--cyan);
    stroke-width:2;
    vector-effect:non-scaling-stroke;
  }

  .poly{
    stroke:var(--paper);
    stroke-width:2;
    vector-effect:non-scaling-stroke;
    cursor:pointer;
  }

  .poly.selected{
    stroke:var(--amber);
    stroke-width:3;
  }

  .angle-arc{
    fill:none;
    stroke:var(--amber);
    stroke-width:2;
    vector-effect:non-scaling-stroke;
  }

  .angle-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    fill:var(--amber);
    font-weight:600;
    pointer-events:none;
  }

  .ghost{
    stroke:var(--text-dim);
    stroke-dasharray:4 4;
    stroke-width:1.5;
    fill:none;
    vector-effect:non-scaling-stroke;
  }

  .measure-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    fill:var(--text-dim);
    pointer-events:none;
  }

  /* ---------- HUD ---------- */

  #hud{
    position:absolute;
    top:14px;
    left:14px;
    background:rgba(14,44,81,0.85);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    pointer-events:none;
    line-height:1.6;
  }

  #hud b{
    color:var(--paper);
  }

  #coord{
    position:absolute;
    bottom:14px;
    right:14px;
    background:rgba(14,44,81,0.85);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:6px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--cyan);
    pointer-events:none;
  }

  #hint{
    position:absolute;
    bottom:14px;
    left:14px;
    background:rgba(14,44,81,0.85);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 14px;
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--text-dim);
    max-width:380px;
    pointer-events:none;
  }

  /* ---------- Polygon editor ---------- */

  #polygon-editor{
    position:absolute;
    top:14px;
    right:14px;
    width:190px;
    background:rgba(30,30,33,0.96);
    border:1px solid var(--panel-border);
    border-radius:9px;
    padding:12px;
    display:none;
    z-index:20;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }

  #polygon-editor.visible{
    display:block;
  }

  #polygon-editor-title{
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--paper);
    margin-bottom:9px;
  }

  #polygon-color{
    width:100%;
    height:34px;
    padding:2px;
    background:#151517;
    border:1px solid var(--panel-border);
    border-radius:6px;
    cursor:pointer;
  }

  #polygon-opacity{
    width:100%;
    margin-top:8px;
    accent-color:var(--amber);
  }

  #polygon-editor small{
    display:block;
    margin-top:4px;
    color:var(--text-dim);
    font-size:9px;
    font-family:'IBM Plex Mono',monospace;
  }
</style>
</head>

<body>

<div id="app">

  <div id="toolbar">

    <div class="brand">
      <b>GeoBoard</b>
      CONSTRUCT
    </div>

    <button class="tool active" data-tool="select" title="Select / Move">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M5 3l14 8-6 2-2 6-6-16z"/>
      </svg>
      <span>SELECT</span>
    </button>

    <button class="tool" data-tool="point" title="Point">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3" fill="currentColor"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
      <span>POINT</span>
    </button>

    <button class="tool" data-tool="line" title="Segment">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <line x1="4" y1="20" x2="20" y2="4"/>
        <circle cx="4" cy="20" r="2" fill="currentColor"/>
        <circle cx="20" cy="4" r="2" fill="currentColor"/>
      </svg>
      <span>LINE</span>
    </button>

    <button class="tool" data-tool="circle" title="Circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8"/>
        <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
      </svg>
      <span>CIRCLE</span>
    </button>

    <button class="tool" data-tool="polygon" title="Polygon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polygon points="12,3 21,9 18,20 6,20 3,9"/>
      </svg>
      <span>POLY</span>
    </button>

    <button class="tool" data-tool="angle" title="Angle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 20h16"/>
        <path d="M4 20L18 6"/>
        <path d="M8 20a8 8 0 0 1 2-5.5"/>
      </svg>
      <span>ANGLE</span>
    </button>

    <div class="tool-divider"></div>

    <div id="controls">
      <label>GRID</label>
      <input id="grid-size" type="number" min="0.01" step="0.01" value="1">
    </div>

    <div class="tool-divider"></div>

    <button class="tool" id="undo-btn" title="Undo last shape">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M9 14l-5-5 5-5"/>
        <path d="M4 9h10a6 6 0 0 1 0 12h-2"/>
      </svg>
      <span>UNDO</span>
    </button>

    <button class="tool" id="clear-btn" title="Clear board">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 6h18"/>
        <path d="M8 6V4h8v2"/>
        <path d="M6 6l1 14h10l1-14"/>
      </svg>
      <span>CLEAR</span>
    </button>

  </div>

  <div id="canvas-wrap">

    <svg id="board"></svg>

    <div id="hud">
      MODE: <b id="hud-mode">SELECT</b>
    </div>

    <div id="hint">
      Double-click empty space and drag to move around. Drag points to move them.
    </div>

    <div id="coord">
      x: 0 &nbsp; y: 0
    </div>

    <div id="polygon-editor">

      <div id="polygon-editor-title">
        POLYGON COLOR
      </div>

      <input
        id="polygon-color"
        type="color"
        value="#5B9BFF"
      >

      <input
        id="polygon-opacity"
        type="range"
        min="0"
        max="100"
        value="25"
      >

      <small>Fill opacity</small>

    </div>

  </div>
</div>


<script>
(function(){

  const svg = document.getElementById('board');
  const canvasWrap = document.getElementById('canvas-wrap');
  const NS = 'http://www.w3.org/2000/svg';

  const hudMode = document.getElementById('hud-mode');
  const hintBox = document.getElementById('hint-box');
  const coordEl = document.getElementById('coord');

  const gridSizeInput = document.getElementById('grid-size');

  const polygonEditor = document.getElementById('polygon-editor');
  const polygonColor = document.getElementById('polygon-color');
  const polygonOpacity = document.getElementById('polygon-opacity');

  const UNIT_BASE = 40;

  const POINT_SNAP_PX = 14;

  /*
   * Camera
   *
   * cameraX / cameraY = world coordinates at the center of screen
   * zoom = pixels per world unit / UNIT_BASE
   */

  let cameraX = 0;
  let cameraY = 0;
  let zoom = 1;

  let origin = null;

  let points = [];

  let shapes = [];

  let nextId = 1;

  let tool = 'select';

  let pending = [];

  let dragId = null;

  let hoverId = null;

  let selectedShape = null;

  let currentSnap = null;

  let mouseInside = false;

  let isPanning = false;

  let panStart = null;

  let didPan = false;

  let doubleClickPending = false;


  const hints = {

    select:
      'Drag any point to move it. Double-click empty space and drag to pan around the infinite grid. Click a polygon to edit its color.',

    point:
      'Click anywhere to place a point — snaps to the grid automatically.',

    line:
      'Click two points (or empty space) to draw a segment. Clicks snap to grid & existing points.',

    circle:
      'Click a center point, then a second point to set the radius.',

    polygon:
      'Click each vertex in order. Click the first vertex again to close the shape.',

    angle:
      'Click three points in order — the second click is the angle vertex.'
  };


  function setTool(t){

    tool = t;

    pending = [];

    selectedShape = null;

    hidePolygonEditor();

    document
      .querySelectorAll('.tool[data-tool]')
      .forEach(b =>
        b.classList.toggle(
          'active',
          b.dataset.tool === t
        )
      );

    hudMode.textContent = t.toUpperCase();

    hintBox.textContent = hints[t];

    render();
  }


  document
    .querySelectorAll('.tool[data-tool]')
    .forEach(b => {

      b.addEventListener('click', () => {

        setTool(b.dataset.tool);

      });

    });


  /*
   * GRID SIZE
   */

  gridSizeInput.addEventListener('change', () => {

    let value = parseFloat(gridSizeInput.value);

    if(!Number.isFinite(value) || value <= 0){

      value = 1;

      gridSizeInput.value = value;
    }

    render();

  });


  gridSizeInput.addEventListener('keydown', e => {

    if(e.key === 'Enter'){

      gridSizeInput.blur();

    }

  });


  /*
   * CLEAR
   */

  document
    .getElementById('clear-btn')
    .addEventListener('click', () => {

      points = [];

      shapes = [];

      pending = [];

      selectedShape = null;

      hidePolygonEditor();

      render();

    });


  /*
   * UNDO
   */

  document
    .getElementById('undo-btn')
    .addEventListener('click', () => {

      if(shapes.length){

        const removed = shapes.pop();

        if(selectedShape === removed){

          selectedShape = null;

          hidePolygonEditor();

        }

      }
      else if(points.length){

        points.pop();

      }

      render();

    });


  /*
   * CAMERA
   */

  function getUnit(){

    return UNIT_BASE * zoom;

  }


  function worldToScreen(wx, wy){

    const rect = svg.getBoundingClientRect();

    return {

      x: rect.width / 2 + (wx - cameraX) * getUnit(),

      y: rect.height / 2 - (wy - cameraY) * getUnit()

    };

  }


  function screenToWorld(sx, sy){

    const rect = svg.getBoundingClientRect();

    return {

      x: cameraX + (sx - rect.width / 2) / getUnit(),

      y: cameraY - (sy - rect.height / 2) / getUnit()

    };

  }


  function svgPoint(evt){

    const rect = svg.getBoundingClientRect();

    return {

      x: evt.clientX - rect.left,

      y: evt.clientY - rect.top

    };

  }


  /*
   * SNAP
   */

  function findNearPoint(x,y,thresh,excludeId){

    let best = null;

    let bd = thresh;

    for(const p of points){

      if(p.id === excludeId)
        continue;

      const s = worldToScreen(p.x,p.y);

      const d = Math.hypot(
        s.x-x,
        s.y-y
      );

      if(d < bd){

        bd = d;

        best = p;

      }

    }

    return best;

  }


  function resolveSnap(sx, sy, excludeId){

    const near =
      findNearPoint(
        sx,
        sy,
        POINT_SNAP_PX,
        excludeId
      );

    if(near){

      const s = worldToScreen(
        near.x,
        near.y
      );

      return {

        x:s.x,
        y:s.y,

        worldX:near.x,
        worldY:near.y,

        snappedTo:near.id,

        kind:'point'

      };

    }


    const w =
      screenToWorld(sx,sy);


    const grid =
      getGridSize();


    const gx =
      Math.round(w.x/grid)*grid;


    const gy =
      Math.round(w.y/grid)*grid;


    const g =
      worldToScreen(gx,gy);


    return {

      x:g.x,
      y:g.y,

      worldX:gx,
      worldY:gy,

      snappedTo:null,

      kind:'grid'

    };

  }


  function getGridSize(){

    let value =
      parseFloat(gridSizeInput.value);

    if(!Number.isFinite(value) || value <= 0)
      value = 1;

    return value;

  }


  function addPoint(x,y){

    const p = {

      id:nextId++,

      x,
      y

    };

    points.push(p);

    return p;

  }


  function getOrCreatePoint(snap){

    if(snap.snappedTo != null){

      return points.find(
        p => p.id === snap.snappedTo
      );

    }

    return addPoint(
      snap.worldX,
      snap.worldY
    );

  }


  function dist(a,b){

    return Math.hypot(
      a.x-b.x,
      a.y-b.y
    );

  }


  function angleBetween(a,vertex,c){

    const v1 = {

      x:a.x-vertex.x,
      y:a.y-vertex.y

    };

    const v2 = {

      x:c.x-vertex.x,
      y:c.y-vertex.y

    };


    let ang =
      Math.atan2(v2.y,v2.x)
      -
      Math.atan2(v1.y,v1.x);


    let deg =
      ang*180/Math.PI;


    deg =
      ((deg%360)+360)%360;


    if(deg>180)
      deg=360-deg;


    return deg;

  }


  /*
   * HEX → RGBA
   */

  function hexToRgba(hex, alpha){

    hex = hex.replace('#','');

    const r =
      parseInt(hex.substring(0,2),16);

    const g =
      parseInt(hex.substring(2,4),16);

    const b =
      parseInt(hex.substring(4,6),16);

    return `rgba(${r},${g},${b},${alpha})`;

  }


  /*
   * POLYGON EDITOR
   */

  function showPolygonEditor(shape){

    if(!shape || shape.type !== 'polygon')
      return;


    selectedShape = shape;


    polygonColor.value =
      shape.color || '#5B9BFF';


    polygonOpacity.value =
      Math.round(
        (shape.opacity ?? 0.25) * 100
      );


    polygonEditor.classList.add('visible');

  }


  function hidePolygonEditor(){

    polygonEditor.classList.remove('visible');

    selectedShape = null;

  }


  polygonColor.addEventListener('input', () => {

    if(!selectedShape)
      return;

    selectedShape.color =
      polygonColor.value;

    render();

  });


  polygonOpacity.addEventListener('input', () => {

    if(!selectedShape)
      return;

    selectedShape.opacity =
      parseInt(polygonOpacity.value,10)/100;

    render();

  });


  /*
   * Find polygon underneath cursor
   */

  function findPolygonAt(sx,sy){

    /*
     * SVG doesn't provide an easy polygon hit-test
     * in all browsers, so we use point-in-polygon.
     */

    for(let i=shapes.length-1;i>=0;i--){

      const shape = shapes[i];

      if(shape.type !== 'polygon')
        continue;


      const pts =
        shape.pts
          .map(byId)
          .filter(Boolean);


      if(pts.length < 3)
        continue;


      const screenPts =
        pts.map(p =>
          worldToScreen(p.x,p.y)
        );


      if(pointInPolygon(
        sx,
        sy,
        screenPts
      )){

        return shape;

      }

    }


    return null;

  }


  function pointInPolygon(x,y,pts){

    let inside = false;


    for(
      let i=0,j=pts.length-1;
      i<pts.length;
      j=i++
    ){

      const xi=pts[i].x;
      const yi=pts[i].y;

      const xj=pts[j].x;
      const yj=pts[j].y;


      const intersect =
        ((yi>y)!==(yj>y))
        &&
        (
          x <
          (xj-xi)*(y-yi)/(yj-yi)+xi
        );


      if(intersect)
        inside=!inside;

    }


    return inside;

  }


  /*
   * MOUSE MOVE
   */

  svg.addEventListener('mousemove', e => {

    const raw = svgPoint(e);

    mouseInside = true;


    /*
     * PAN
     */

    if(isPanning){

      const dx =
        raw.x-panStart.mouseX;

      const dy =
        raw.y-panStart.mouseY;


      cameraX =
        panStart.cameraX
        - dx/getUnit();


      cameraY =
        panStart.cameraY
        + dy/getUnit();


      didPan = true;

      render();

      return;

    }


    /*
     * POINT DRAG
     */

    if(dragId !== null){

      const snap =
        resolveSnap(
          raw.x,
          raw.y,
          dragId
        );


      const p =
        points.find(
          p=>p.id===dragId
        );


      if(p){

        p.x = snap.worldX;

        p.y = snap.worldY;

      }


      currentSnap = snap;

      const w =
        screenToWorld(
          raw.x,
          raw.y
        );


      coordEl.textContent =
        `x: ${w.x.toFixed(2)}   y: ${w.y.toFixed(2)}`;


      render();

      return;

    }


    const snap =
      resolveSnap(
        raw.x,
        raw.y,
        null
      );


    currentSnap = snap;


    const w =
      screenToWorld(
        raw.x,
        raw.y
      );


    coordEl.textContent =
      `x: ${w.x.toFixed(2)}   y: ${w.y.toFixed(2)}`;


    const newHover =
      snap.snappedTo;


    if(newHover !== hoverId){

      hoverId = newHover;

    }


    render();

  });


  /*
   * MOUSE LEAVE
   */

  svg.addEventListener('mouseleave', () => {

    mouseInside = false;

    if(dragId === null){

      hoverId = null;

    }

    render();

  });


  /*
   * MOUSE DOWN
   */

  svg.addEventListener('mousedown', e => {

    if(e.button !== 0)
      return;


    const raw =
      svgPoint(e);


    /*
     * SELECT MODE
     */

    if(tool === 'select'){

      /*
       * First try a point.
       */

      const near =
        findNearPoint(
          raw.x,
          raw.y,
          POINT_SNAP_PX,
          null
        );


      if(near){

        dragId = near.id;

        selectedShape = null;

        hidePolygonEditor();

        render();

        return;

      }


      /*
       * Then try polygon.
       */

      const polygon =
        findPolygonAt(
          raw.x,
          raw.y
        );


      if(polygon){

        showPolygonEditor(polygon);

        render();

        return;

      }


      /*
       * Empty canvas.
       *
       * We don't immediately pan.
       * Double-click is required.
       */

      return;

    }


    const snap =
      resolveSnap(
        raw.x,
        raw.y,
        null
      );


    /*
     * POINT
     */

    if(tool === 'point'){

      getOrCreatePoint(snap);

      render();

      return;

    }


    /*
     * LINE
     */

    if(tool === 'line'){

      const p =
        getOrCreatePoint(snap);


      pending.push(p);


      if(pending.length === 2){

        shapes.push({

          type:'line',

          a:pending[0].id,

          b:pending[1].id

        });


        pending=[];

      }


      render();

      return;

    }


    /*
     * CIRCLE
     */

    if(tool === 'circle'){

      const p =
        getOrCreatePoint(snap);


      pending.push(p);


      if(pending.length === 2){

        shapes.push({

          type:'circle',

          center:pending[0].id,

          edge:pending[1].id

        });


        pending=[];

      }


      render();

      return;

    }


    /*
     * POLYGON
     */

    if(tool === 'polygon'){

      const p =
        getOrCreatePoint(snap);


      if(
        pending.length >= 3
        &&
        p.id === pending[0].id
      ){

        shapes.push({

          type:'polygon',

          pts:pending.map(
            pt=>pt.id
          ),

          color:'#5B9BFF',

          opacity:0.25

        });


        pending=[];

      }
      else{

        pending.push(p);

      }


      render();

      return;

    }


    /*
     * ANGLE
     */

    if(tool === 'angle'){

      const p =
        getOrCreatePoint(snap);


      pending.push(p);


      if(pending.length === 3){

        shapes.push({

          type:'angle',

          a:pending[0].id,

          vertex:pending[1].id,

          c:pending[2].id

        });


        pending=[];

      }


      render();

      return;

    }

  });


  /*
   * DOUBLE CLICK
   *
   * Double-click empty space and then drag.
   */

  svg.addEventListener('dblclick', e => {

    if(tool === 'select'){

      const raw =
        svgPoint(e);


      const near =
        findNearPoint(
          raw.x,
          raw.y,
          POINT_SNAP_PX,
          null
        );


      const polygon =
        findPolygonAt(
          raw.x,
          raw.y
        );


      /*
       * Only allow panning from empty canvas.
       */

      if(!near && !polygon){

        e.preventDefault();

        doubleClickPending = true;

      }

    }


    /*
     * Polygon early finish.
     */

    if(
      tool === 'polygon'
      &&
      pending.length >= 3
    ){

      shapes.push({

        type:'polygon',

        pts:pending.map(
          pt=>pt.id
        ),

        color:'#5B9BFF',

        opacity:0.25

      });


      pending=[];

      render();

    }

  });


  /*
   * Start pan after double-click.
   *
   * We use a small timeout because the browser sends
   * dblclick after the second mousedown.
   */

  svg.addEventListener('mousedown', e => {

    if(e.button !== 0)
      return;

    if(
      tool === 'select'
      &&
      doubleClickPending
    ){

      const raw =
        svgPoint(e);


      const near =
        findNearPoint(
          raw.x,
          raw.y,
          POINT_SNAP_PX,
          null
        );


      const polygon =
        findPolygonAt(
          raw.x,
          raw.y
        );


      if(!near && !polygon){

        isPanning = true;

        didPan = false;

        panStart = {

          mouseX:raw.x,

          mouseY:raw.y,

          cameraX:cameraX,

          cameraY:cameraY

        };


        svg.classList.add('panning');

      }


      doubleClickPending = false;

    }

  });


  /*
   * GLOBAL MOUSE UP
   */

  window.addEventListener('mouseup', () => {

    if(dragId !== null){

      dragId = null;

      render();

    }


    if(isPanning){

      isPanning = false;

      svg.classList.remove('panning');

      render();

    }

  });


  /*
   * MOUSE WHEEL ZOOM
   *
   * Zooms toward cursor position.
   */

  svg.addEventListener('wheel', e => {

    e.preventDefault();


    const mouse =
      svgPoint(e);


    const before =
      screenToWorld(
        mouse.x,
        mouse.y
      );


    const factor =
      e.deltaY < 0
        ? 1.12
        : 1/1.12;


    zoom *= factor;


    zoom =
      Math.max(
        0.05,
        Math.min(50,zoom)
      );


    /*
     * Keep cursor over same world point.
     */

    const after =
      screenToWorld(
        mouse.x,
        mouse.y
      );


    cameraX +=
      before.x-after.x;


    cameraY +=
      before.y-after.y;


    render();

  }, {passive:false});


  /*
   * RESIZE
   */

  window.addEventListener('resize', () => {

    render();

  });


  /*
   * SVG ELEMENT HELPER
   */

  function el(tag, attrs){

    const e =
      document.createElementNS(
        NS,
        tag
      );


    for(const k in attrs){

      e.setAttribute(
        k,
        attrs[k]
      );

    }


    return e;

  }


  /*
   * GRID
   */

  function drawGridAndAxes(rect){

    const g =
      el('g',{});


    const grid =
      getGridSize();


    const unit =
      getUnit();


    /*
     * Determine visible world bounds.
     */

    const topLeft =
      screenToWorld(
        0,
        0
      );


    const bottomRight =
      screenToWorld(
        rect.width,
        rect.height
      );


    let minX =
      Math.floor(
        bottomRight.x/grid
      )-1;


    let maxX =
      Math.ceil(
        topLeft.x/grid
      )+1;


    let minY =
      Math.floor(
        bottomRight.y/grid
      )-1;


    let maxY =
      Math.ceil(
        topLeft.y/grid
      )+1;


    /*
     * Avoid generating millions of lines
     * when zoomed extremely far out.
     */

    const maxLines = 500;


    if(maxX-minX > maxLines){

      const skip =
        Math.ceil(
          (maxX-minX)/maxLines
        );


      minX =
        Math.floor(minX/skip)*skip;

      maxX =
        Math.ceil(maxX/skip)*skip;


      for(
        let i=minX;
        i<=maxX;
        i+=skip
      ){

        const wx =
          i*grid;


        const s =
          worldToScreen(
            wx,
            0
          );


        g.appendChild(
          el('line',{
            x1:s.x,
            y1:0,
            x2:s.x,
            y2:rect.height,
            class:
              wx===0
              ? 'axis-line'
              : 'grid-line'
          })
        );

      }

    }
    else{

      for(
        let i=minX;
        i<=maxX;
        i++
      ){

        const wx =
          i*grid;


        const s =
          worldToScreen(
            wx,
            0
          );


        g.appendChild(
          el('line',{
            x1:s.x,
            y1:0,
            x2:s.x,
            y2:rect.height,
            class:
              Math.abs(wx)<1e-12
              ? 'axis-line'
              : 'grid-line'
          })
        );

      }

    }


    if(maxY-minY > maxLines){

      const skip =
        Math.ceil(
          (maxY-minY)/maxLines
        );


      minY =
        Math.floor(minY/skip)*skip;

      maxY =
        Math.ceil(maxY/skip)*skip;


      for(
        let j=minY;
        j<=maxY;
        j+=skip
      ){

        const wy =
          j*grid;


        const s =
          worldToScreen(
            0,
            wy
          );


        g.appendChild(
          el('line',{
            x1:0,
            y1:s.y,
            x2:rect.width,
            y2:s.y,
            class:
              Math.abs(wy)<1e-12
              ? 'axis-line'
              : 'grid-line'
          })
        );

      }

    }
    else{

      for(
        let j=minY;
        j<=maxY;
        j++
      ){

        const wy =
          j*grid;


        const s =
          worldToScreen(
            0,
            wy
          );


        g.appendChild(
          el('line',{
            x1:0,
            y1:s.y,
            x2:rect.width,
            y2:s.y,
            class:
              Math.abs(wy)<1e-12
              ? 'axis-line'
              : 'grid-line'
          })
        );

      }

    }


    /*
     * Axis labels.
     */

    const labelStep =
      chooseLabelStep(
        grid,
        zoom
      );


    const labelMinX =
      Math.floor(
        bottomRight.x/labelStep
      )-1;


    const labelMaxX =
      Math.ceil(
        topLeft.x/labelStep
      )+1;


    const labelMinY =
      Math.floor(
        bottomRight.y/labelStep
      )-1;


    const labelMaxY =
      Math.ceil(
        topLeft.y/labelStep
      )+1;


    for(
      let i=labelMinX;
      i<=labelMaxX;
      i++
    ){

      const wx =
        i*labelStep;


      if(Math.abs(wx)<1e-12)
        continue;


      const s =
        worldToScreen(
          wx,
          0
        );


      if(
        s.x<0 ||
        s.x>rect.width
      )
        continue;


      const t =
        el('text',{
          class:'axis-label',
          x:s.x,
          y:Math.min(
            Math.max(
              worldToScreen(0,0).y+14,
              12
            ),
            rect.height-4
          ),
          'text-anchor':'middle'
        });


      t.textContent =
        formatNumber(wx);


      g.appendChild(t);

    }


    for(
      let j=labelMinY;
      j<=labelMaxY;
      j++
    ){

      const wy =
        j*labelStep;


      if(Math.abs(wy)<1e-12)
        continue;


      const s =
        worldToScreen(
          0,
          wy
        );


      if(
        s.y<0 ||
        s.y>rect.height
      )
        continue;


      const t =
        el('text',{
          class:'axis-label',
          x:Math.min(
            Math.max(
              worldToScreen(0,0).x-8,
              20
            ),
            rect.width-4
          ),
          y:s.y+4,
          'text-anchor':'end'
        });


      t.textContent =
        formatNumber(wy);


      g.appendChild(t);

    }


    /*
     * Origin.
     */

    const originScreen =
      worldToScreen(
        0,
        0
      );


    const o =
      el('text',{
        class:'axis-label origin',
        x:Math.max(
          originScreen.x-8,
          20
        ),
        y:Math.min(
          Math.max(
            originScreen.y+14,
            12
          ),
          rect.height-4
        ),
        'text-anchor':'end'
      });


    o.textContent='0';

    g.appendChild(o);


    return g;

  }


  function chooseLabelStep(grid, zoom){

    /*
     * We want labels roughly every 40–100 pixels.
     */

    const desiredWorld =
      70/(UNIT_BASE*zoom);


    const raw =
      Math.max(
        grid,
        desiredWorld
      );


    const exponent =
      Math.floor(
        Math.log10(raw)
      );


    const base =
      Math.pow(
        10,
        exponent
      );


    const multipliers =
      [1,2,5,10];


    for(const m of multipliers){

      const step =
        m*base;


      if(step>=raw){

        /*
         * Keep labels aligned to the actual grid
         * whenever possible.
         */

        const ratio =
          step/grid;


        if(
          Math.abs(
            ratio-Math.round(ratio)
          ) < 1e-8
        ){

          return step;

        }

        return step;

      }

    }


    return 10*base;

  }


  function formatNumber(n){

    if(Math.abs(n)<1e-10)
      return '0';


    if(
      Math.abs(n)>=1000000
      ||
      Math.abs(n)<0.001
    ){

      return n.toExponential(2);

    }


    return Number(
      n.toFixed(6)
    ).toString();

  }


  /*
   * RENDER
   */

  function render(){

    const rect =
      svg.getBoundingClientRect();


    svg.innerHTML='';


    /*
     * GRID
     */

    svg.appendChild(
      drawGridAndAxes(rect)
    );


    /*
     * SHAPES
     */

    for(const s of shapes){

      /*
       * LINE
       */

      if(s.type==='line'){

        const a=byId(s.a);
        const b=byId(s.b);


        if(!a||!b)
          continue;


        const A =
          worldToScreen(
            a.x,
            a.y
          );


        const B =
          worldToScreen(
            b.x,
            b.y
          );


        svg.appendChild(
          el('line',{
            class:'seg',
            x1:A.x,
            y1:A.y,
            x2:B.x,
            y2:B.y
          })
        );


        const mx =
          (A.x+B.x)/2;


        const my =
          (A.y+B.y)/2;


        const label =
          el('text',{
            class:'measure-label',
            x:mx+8,
            y:my-8
          });


        label.textContent =
          dist(a,b).toFixed(2)+'u';


        svg.appendChild(label);

      }


      /*
       * CIRCLE
       */

      else if(s.type==='circle'){

        const c=byId(s.center);
        const edge=byId(s.edge);


        if(!c||!edge)
          continue;


        const C =
          worldToScreen(
            c.x,
            c.y
          );


        const E =
          worldToScreen(
            edge.x,
            edge.y
          );


        const rpx =
          Math.hypot(
            C.x-E.x,
            C.y-E.y
          );


        svg.appendChild(
          el('circle',{
            class:'circ',
            cx:C.x,
            cy:C.y,
            r:rpx
          })
        );


        svg.appendChild(
          el('line',{
            class:'ghost',
            x1:C.x,
            y1:C.y,
            x2:E.x,
            y2:E.y
          })
        );


        const label =
          el('text',{
            class:'measure-label',
            x:C.x+8,
            y:C.y-rpx-8
          });


        label.textContent =
          'r = '+dist(c,edge).toFixed(2)+'u';


        svg.appendChild(label);

      }


      /*
       * POLYGON
       */

      else if(s.type==='polygon'){

        const pts =
          s.pts
            .map(byId)
            .filter(Boolean);


        if(pts.length<2)
          continue;


        const pointsAttr =
          pts
            .map(p => {

              const s =
                worldToScreen(
                  p.x,
                  p.y
                );

              return `${s.x},${s.y}`;

            })
            .join(' ');


        const color =
          s.color || '#5B9BFF';


        const opacity =
          s.opacity ?? 0.25;


        const polygon =
          el('polygon',{

            class:
              'poly'
              +
              (
                selectedShape===s
                ? ' selected'
                : ''
              ),

            points:pointsAttr,

            fill:hexToRgba(
              color,
              opacity
            ),

            stroke:'#E8E8EA'

          });


        /*
         * Clicking polygon selects it.
         */

        polygon.addEventListener(
          'mousedown',
          e => {

            if(tool !== 'select')
              return;


            e.stopPropagation();


            showPolygonEditor(s);

            render();

          }
        );


        svg.appendChild(polygon);

      }


      /*
       * ANGLE
       */

      else if(s.type==='angle'){

        const a=byId(s.a);
        const v=byId(s.vertex);
        const c=byId(s.c);


        if(!a||!v||!c)
          continue;


        const A =
          worldToScreen(
            a.x,
            a.y
          );


        const V =
          worldToScreen(
            v.x,
            v.y
          );


        const C =
          worldToScreen(
            c.x,
            c.y
          );


        svg.appendChild(
          el('line',{
            class:'ghost',
            x1:V.x,
            y1:V.y,
            x2:A.x,
            y2:A.y
          })
        );


        svg.appendChild(
          el('line',{
            class:'ghost',
            x1:V.x,
            y1:V.y,
            x2:C.x,
            y2:C.y
          })
        );


        const deg =
          angleBetween(
            a,
            v,
            c
          );


        const r=28;


        const startAng =
          Math.atan2(
            A.y-V.y,
            A.x-V.x
          );


        let endAng =
          Math.atan2(
            C.y-V.y,
            C.x-V.x
          );


        let sweep =
          endAng-startAng;


        while(sweep<0)
          sweep+=2*Math.PI;


        const large =
          sweep>Math.PI
            ? 1
            : 0;


        const sx =
          V.x+
          r*Math.cos(startAng);


        const sy =
          V.y+
          r*Math.sin(startAng);


        const ex =
          V.x+
          r*Math.cos(endAng);


        const ey =
          V.y+
          r*Math.sin(endAng);


        svg.appendChild(
          el('path',{
            class:'angle-arc',
            d:
              `M ${sx} ${sy}
               A ${r} ${r} 0 ${large} 1 ${ex} ${ey}`
          })
        );


        const midAng =
          startAng+sweep/2;


        const lx =
          V.x+
          (r+18)*
          Math.cos(midAng);


        const ly =
          V.y+
          (r+18)*
          Math.sin(midAng);


        const label =
          el('text',{
            class:'angle-label',
            x:lx,
            y:ly,
            'text-anchor':'middle'
          });


        label.textContent =
          deg.toFixed(1)+'°';


        svg.appendChild(label);

      }

    }


    /*
     * PENDING CONSTRUCTION
     */

    if(pending.length){

      for(
        let i=0;
        i<pending.length-1;
        i++
      ){

        const A =
          worldToScreen(
            pending[i].x,
            pending[i].y
          );


        const B =
          worldToScreen(
            pending[i+1].x,
            pending[i+1].y
          );


        svg.appendChild(
          el('line',{
            class:'ghost',
            x1:A.x,
            y1:A.y,
            x2:B.x,
            y2:B.y
          })
        );

      }

    }


    /*
     * POINTS
     */

    for(const p of points){

      const s =
        worldToScreen(
          p.x,
          p.y
        );


      const isHover =
        p.id===hoverId
        ||
        p.id===dragId;


      svg.appendChild(
        el('circle',{

          class:
            'pt'
            +
            (
              isHover
              ? ' hover'
              : ''
            )
            +
            (
              p.id===dragId
              ? ' dragging'
              : ''
            ),

          cx:s.x,

          cy:s.y,

          r:5

        })
      );


      const label =
        el('text',{

          class:'pt-label',

          x:s.x+9,

          y:s.y-9

        });


      label.textContent =
        pointName(p.id);


      svg.appendChild(label);

    }


    /*
     * SNAP INDICATOR
     */

    if(
      mouseInside
      &&
      currentSnap
      &&
      (
        tool!=='select'
        ||
        dragId!==null
      )
    ){

      svg.appendChild(
        el('circle',{

          class:
            'snap-ring'
            +
            (
              currentSnap.kind==='point'
              ? ' point-snap'
              : ''
            ),

          cx:currentSnap.x,

          cy:currentSnap.y,

          r:
            currentSnap.kind==='point'
            ? 10
            : 7

        })
      );

    }

  }


  /*
   * LOOKUP
   */

  function byId(id){

    return points.find(
      p=>p.id===id
    );

  }


  /*
   * POINT NAMES
   */

  function pointName(id){

    const idx =
      points.findIndex(
        p=>p.id===id
      );


    let n=idx;

    let name='';


    do{

      name =
        String.fromCharCode(
          65+(n%26)
        )
        +
        name;


      n =
        Math.floor(n/26)-1;

    }
    while(n>=0);


    return name;

  }


  /*
   * RIGHT CLICK / MIDDLE CLICK
   *
   * Also allows easy panning with middle mouse button.
   */

  svg.addEventListener(
    'mousedown',
    e => {

      if(e.button !== 1)
        return;


      const raw =
        svgPoint(e);


      isPanning=true;

      didPan=false;


      panStart={

        mouseX:raw.x,

        mouseY:raw.y,

        cameraX:cameraX,

        cameraY:cameraY

      };


      svg.classList.add('panning');

      e.preventDefault();

    }
  );


  /*
   * Initial render
   */

  render();

  setTool('select');

})();
</script>

</body>
</html>
