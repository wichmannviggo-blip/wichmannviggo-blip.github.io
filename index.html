<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 BRAINROT OVERLOAD</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial Black, Impact, sans-serif;
    background: #000;
}

body {
    animation: rainbowBG 4s linear infinite;
    color: white;
}

/* =========================
   BACKGROUND
========================= */

@keyframes rainbowBG {
    0%   { background: #ff0000; }
    16%  { background: #ff00ff; }
    33%  { background: #0000ff; }
    50%  { background: #00ffff; }
    66%  { background: #00ff00; }
    83%  { background: #ffff00; }
    100% { background: #ff0000; }
}

#background {
    position: fixed;
    inset: 0;
    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,.08) 0px,
            rgba(255,255,255,.08) 5px,
            transparent 5px,
            transparent 20px
        );
    animation: bgSpin 1s linear infinite;
    pointer-events: none;
}

@keyframes bgSpin {
    from { transform: scale(1) rotate(0deg); }
    to { transform: scale(1.4) rotate(360deg); }
}

/* =========================
   MAIN UI
========================= */

#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

#title {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    font-size: clamp(25px, 5vw, 70px);
    text-align: center;
    color: white;

    text-shadow:
        5px 5px 0 #ff00ff,
        -5px -5px 0 #00ffff,
        0 0 30px white;

    animation: titleSpin .5s infinite alternate;
}

@keyframes titleSpin {
    from { transform: translateX(-50%) rotate(-2deg) scale(1); }
    to   { transform: translateX(-50%) rotate(2deg) scale(1.08); }
}

/* =========================
   COOKIE
========================= */

#cookiePanel {
    position: absolute;
    left: 30px;
    top: 130px;
    width: 280px;
    z-index: 15;

    background: rgba(0,0,0,.8);
    border: 6px solid white;
    border-radius: 25px;
    padding: 15px;
    text-align: center;

    box-shadow:
        0 0 20px #fff,
        0 0 50px #ff00ff,
        0 0 100px #00ffff;
}

#cookie {
    width: 170px;
    height: 170px;
    margin: 10px auto;

    border-radius: 50%;
    background:
        radial-gradient(circle at 30% 30%, #ffd27d, #a95100);

    border: 8px solid #572900;

    font-size: 70px;
    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    box-shadow:
        inset -15px -15px 20px rgba(0,0,0,.4),
        0 0 30px #ff8800;

    transition: transform .05s;
}

#cookie:active {
    transform: scale(.8) rotate(20deg);
}

.stat {
    font-family: Arial, sans-serif;
    font-weight: bold;
    margin: 5px;
}

#cookieCount {
    font-size: 28px;
    color: #ffe600;
}

#combo {
    font-size: 22px;
    color: #00ffff;
}

/* =========================
   TOILET
========================= */

#toilet {
    position: absolute;
    right: 8%;
    top: 170px;

    font-size: 120px;
    z-index: 10;

    animation:
        toiletDance .35s infinite alternate,
        toiletRainbow 1s linear infinite;

    cursor: pointer;

    filter:
        drop-shadow(0 0 15px white)
        drop-shadow(0 0 30px #00ffff);
}

@keyframes toiletDance {
    from {
        transform: rotate(-15deg) translateY(0);
    }
    to {
        transform: rotate(15deg) translateY(-30px);
    }
}

@keyframes toiletRainbow {
    0% { filter: hue-rotate(0deg) drop-shadow(0 0 20px white); }
    100% { filter: hue-rotate(360deg) drop-shadow(0 0 20px white); }
}

/* =========================
   GACHA
========================= */

#gacha {
    position: absolute;
    right: 30px;
    bottom: 30px;
    z-index: 20;

    width: 250px;
    padding: 15px;

    background: rgba(0,0,0,.85);
    border: 5px solid #fff;
    border-radius: 20px;

    text-align: center;
}

button {
    border: 4px solid white;
    background: #ff00aa;
    color: white;
    font-family: Arial Black, sans-serif;
    font-size: 17px;
    padding: 10px 15px;
    border-radius: 12px;
    cursor: pointer;

    box-shadow: 0 0 15px white;
}

button:hover {
    transform: scale(1.1) rotate(-2deg);
}

button:active {
    transform: scale(.9);
}

#gachaResult {
    font-size: 35px;
    min-height: 50px;
    margin: 10px;
}

/* =========================
   SLOPE GAME
========================= */

#slope {
    position: absolute;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);

    width: min(600px, 55vw);
    height: 230px;

    border: 5px solid white;
    background:
        linear-gradient(
            135deg,
            #111 25%,
            #222 25%,
            #222 50%,
            #111 50%
        );
    background-size: 40px 40px;

    overflow: hidden;
    z-index: 5;

    box-shadow: 0 0 30px cyan;
}

#ball {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 50%;

    background: white;

    left: 50%;
    bottom: 40px;

    box-shadow:
        0 0 10px white,
        0 0 30px cyan,
        0 0 50px magenta;
}

.slopeObstacle {
    position: absolute;
    width: 35px;
    height: 35px;

    background: red;
    border: 4px solid white;

    transform: rotate(45deg);

    box-shadow: 0 0 20px red;
}

/* =========================
   COMBO
========================= */

#comboBar {
    position: absolute;
    left: 50%;
    top: 110px;
    transform: translateX(-50%);

    width: 300px;
    height: 25px;

    background: black;
    border: 3px solid white;

    z-index: 20;
}

#comboFill {
    height: 100%;
    width: 0%;

    background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        magenta
    );

    background-size: 300% 100%;
    animation: rainbowBar .5s linear infinite;
}

@keyframes rainbowBar {
    to {
        background-position: 300% 0;
    }
}

/* =========================
   FLOATING TEXT
========================= */

.floatText {
    position: fixed;
    z-index: 999;

    pointer-events: none;

    font-size: 30px;
    color: white;

    text-shadow:
        3px 3px 0 black,
        0 0 20px cyan;

    animation: floatUp 1s forwards;
}

@keyframes floatUp {
    from {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
    }

    to {
        opacity: 0;
        transform: scale(2) translateY(-180px) rotate(30deg);
    }
}

/* =========================
   EXPLOSIONS
========================= */

.explosion {
    position: fixed;
    pointer-events: none;
    z-index: 900;

    font-size: 70px;

    animation: explode .7s forwards;
}

@keyframes explode {
    0% {
        transform: scale(.2) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: scale(4) rotate(360deg);
        opacity: 0;
    }
}

/* =========================
   RANDOM NOTIFICATIONS
========================= */

#notifications {
    position: fixed;
    right: 20px;
    top: 20px;
    z-index: 1000;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.notification {
    padding: 15px;

    background: rgba(0,0,0,.9);
    border: 4px solid white;
    border-radius: 12px;

    animation: notificationIn .3s, notificationOut .5s 3s forwards;

    box-shadow:
        0 0 20px magenta,
        0 0 40px cyan;
}

@keyframes notificationIn {
    from {
        transform: translateX(300px) rotate(20deg);
    }
    to {
        transform: translateX(0) rotate(0);
    }
}

@keyframes notificationOut {
    to {
        transform: translateX(400px);
        opacity: 0;
    }
}

/* =========================
   SCREEN CHAOS
========================= */

body.chaos #app {
    animation: chaos .15s infinite;
}

@keyframes chaos {
    0% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(8px,-5px) rotate(1deg); }
    50% { transform: translate(-8px,5px) rotate(-1deg); }
    75% { transform: translate(5px,8px) rotate(1deg); }
    100% { transform: translate(0,0); }
}

/* =========================
   GIANT EVENT
========================= */

#event {
    position: fixed;
    inset: 0;

    display: none;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.8);

    z-index: 5000;

    text-align: center;
}

#eventText {
    font-size: clamp(40px, 10vw, 130px);

    color: white;

    text-shadow:
        5px 5px 0 red,
        -5px -5px 0 cyan,
        0 0 40px white;

    animation: eventText .2s infinite alternate;
}

@keyframes eventText {
    from {
        transform: rotate(-5deg) scale(1);
    }
    to {
        transform: rotate(5deg) scale(1.15);
    }
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 800px) {
    #cookiePanel {
        left: 10px;
        top: 100px;
        width: 220px;
    }

    #cookie {
        width: 120px;
        height: 120px;
        font-size: 50px;
    }

    #toilet {
        right: 2%;
        font-size: 80px;
    }

    #slope {
        width: 50vw;
    }
}
</style>
</head>

<body>

<div id="background"></div>

<div id="app">

    <div id="title">
        🧠 BRAINROT OVERLOAD 🧠
    </div>

    <div id="comboBar">
        <div id="comboFill"></div>
    </div>

    <!-- COOKIE CLICKER -->
    <div id="cookiePanel">

        <div>🍪 COOKIE GENERATOR 🍪</div>

        <div id="cookieCount">
            0 COOKIES
        </div>

        <div id="combo">
            COMBO ×1
        </div>

        <div id="cookie">
            🍪
        </div>

        <div class="stat">
            CPS: <span id="cps">0</span>
        </div>

        <button onclick="buyUpgrade()">
            BUY +1 CPS
        </button>

        <div>
            Upgrade cost:
            <span id="upgradeCost">25</span>
        </div>

    </div>

    <!-- TOILET -->
    <div id="toilet" onclick="toiletClick()">
        🚽
    </div>

    <!-- SLOPE -->
    <div id="slope">

        <div id="ball"></div>

    </div>

    <!-- GACHA -->
    <div id="gacha">

        🎰 BRAINROT GACHA

        <div id="gachaResult">
            ❓
        </div>

        <button onclick="spinGacha()">
            SPIN
        </button>

    </div>

</div>

<div id="notifications"></div>

<div id="event">
    <div id="eventText">
        WHAT THE FUCK IS HAPPENING
    </div>
</div>


<script>

/* =====================================
   GLOBAL VARIABLES
===================================== */

let cookies = 0;
let cps = 0;
let upgradeCost = 25;

let combo = 1;
let comboProgress = 0;

let toiletHits = 0;

let ballX = 50;
let ballY = 40;

let ballVX = 0;
let ballVY = 0;

let obstacles = [];

const brainrotWords = [
    "SKIBIDI",
    "RIZZ",
    "GYATT",
    "SIGMA",
    "OHIO",
    "WHAT",
    "BRO",
    "🗿",
    "💀",
    "🔥",
    "KABOOM",
    "SHEESH",
    "NO WAY",
    "BRAINROT",
    "69",
    "420",
    "999",
    "MAXIMUM OVERLOAD"
];

const gachaItems = [
    "🗿 MOAI",
    "🚽 TOILET",
    "🐸 SILLY FROG",
    "🧍 NPC",
    "🍪 COOKIE",
    "💎 ULTRA GEM",
    "🔥 SIGMA FLAME",
    "🌈 RAINBOW BRAIN",
    "👽 ALIEN",
    "🦆 UNSTOPPABLE DUCK",
    "💀 SKULL OF CONFUSION",
    "🧠 BRAINROT GOD"
];


/* =====================================
   COOKIE CLICKER
===================================== */

const cookie = document.getElementById("cookie");

cookie.addEventListener("click", () => {

    let gain = combo;

    cookies += gain;

    comboProgress += 8;

    if(comboProgress >= 100) {
        combo++;
        comboProgress = 0;

        notify("🔥 COMBO UPGRADED → ×" + combo);
        explosion(window.innerWidth / 2, window.innerHeight / 2);
    }

    updateUI();

    floatText(
        "+" + gain + " 🍪",
        cookie.getBoundingClientRect().left + 50,
        cookie.getBoundingClientRect().top
    );

    if(Math.random() < .25) {
        explosion(
            Math.random() * window.innerWidth,
            Math.random() * window.innerHeight
        );
    }

});


function buyUpgrade() {

    if(cookies >= upgradeCost) {

        cookies -= upgradeCost;

        cps++;

        upgradeCost = Math.floor(upgradeCost * 1.6);

        notify("💰 CPS UPGRADED → " + cps);

        updateUI();

    } else {

        notify("💀 BROKE DETECTED");

    }

}


setInterval(() => {

    cookies += cps;

    updateUI();

}, 1000);


function updateUI() {

    document.getElementById("cookieCount").textContent =
        Math.floor(cookies) + " COOKIES";

    document.getElementById("cps").textContent =
        cps;

    document.getElementById("upgradeCost").textContent =
        upgradeCost;

    document.getElementById("combo").textContent =
        "COMBO ×" + combo;

    document.getElementById("comboFill").style.width =
        comboProgress + "%";

}


/* =====================================
   TOILET
===================================== */

function toiletClick() {

    toiletHits++;

    cookies += 10 * combo;

    comboProgress += 5;

    floatText(
        "🚽 +10",
        window.innerWidth * .8,
        200
    );

    explosion(
        window.innerWidth * .8,
        220
    );

    if(toiletHits % 10 === 0) {

        notify("🚽 TOILET COMBO x" + toiletHits);

    }

    updateUI();

}


/* =====================================
   FLOATING TEXT
===================================== */

function floatText(text, x, y) {

    const el = document.createElement("div");

    el.className = "floatText";

    el.textContent = text;

    el.style.left = x + "px";
    el.style.top = y + "px";

    el.style.transform =
        `rotate(${Math.random()*40-20}deg)`;

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 1000);

}


/* =====================================
   EXPLOSIONS
===================================== */

function explosion(x, y) {

    const el = document.createElement("div");

    el.className = "explosion";

    el.textContent =
        ["💥","✨","🌈","🔥","💀","🤑","🤯","⭐"][Math.floor(Math.random()*8)];

    el.style.left = x + "px";
    el.style.top = y + "px";

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 700);

}


/* =====================================
   NOTIFICATIONS
===================================== */

function notify(message) {

    const box = document.createElement("div");

    box.className = "notification";

    box.textContent = message;

    document.getElementById("notifications")
        .appendChild(box);

    setTimeout(() => box.remove(), 3600);

}


/* =====================================
   RANDOM BRAINROT
===================================== */

setInterval(() => {

    const word =
        brainrotWords[
            Math.floor(Math.random() * brainrotWords.length)
        ];

    floatText(
        word,
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight
    );

}, 700);


/* =====================================
   RANDOM EXPLOSIONS
===================================== */

setInterval(() => {

    explosion(
        Math.random() * window.innerWidth,
        Math.random() * window.innerHeight
    );

}, 900);


/* =====================================
   RANDOM NOTIFICATIONS
===================================== */

const notifications = [
    "🚨 YOUR BRAIN HAS BEEN DETECTED",
    "🔥 MAXIMUM RIZZ ACHIEVED",
    "🚽 TOILET APPROACHING",
    "🍪 COOKIE STONKS",
    "🗿 MOAI HAS JOINED",
    "💀 BRO WHAT",
    "🌈 RGB OVERLOAD",
    "🧠 BRAINROT LEVEL: ILLEGAL",
    "⚠️ TOO MUCH SILLY",
    "📈 STONKS",
    "🦆 DUCK DETECTED",
    "💥 EXPLOSION INCOMING",
    "🤯 CRITICAL BRAINROT",
    "⭐ YOU ARE NOW 4% MORE SIGMA"
];

setInterval(() => {

    notify(
        notifications[
            Math.floor(Math.random()*notifications.length)
        ]
    );

}, 2500);


/* =====================================
   GACHA
===================================== */

function spinGacha() {

    const result =
        gachaItems[
            Math.floor(Math.random()*gachaItems.length)
        ];

    const resultEl =
        document.getElementById("gachaResult");

    resultEl.style.transform = "scale(2) rotate(720deg)";

    resultEl.textContent = "???";

    setTimeout(() => {

        resultEl.textContent = result;

        resultEl.style.transform =
            "scale(1) rotate(0deg)";

        cookies += 100;

        explosion(
            window.innerWidth * .85,
            window.innerHeight * .8
        );

        notify("🎰 YOU GOT: " + result);

        updateUI();

    }, 600);

}


/* =====================================
   CHAOS EVENTS
===================================== */

function chaosEvent() {

    document.body.classList.add("chaos");

    const events = [
        "🌈 RGB DIMENSION",
        "🚽 TOILET INVASION",
        "🍪 COOKIE APOCALYPSE",
        "🧠 BRAINROT OVERDRIVE",
        "💥 KABOOM MODE",
        "🗿 MOAI DIMENSION",
        "🔥 MAXIMUM CHAOS"
    ];

    document.getElementById("eventText").textContent =
        events[Math.floor(Math.random()*events.length)];

    document.getElementById("event").style.display =
        "flex";

    for(let i = 0; i < 25; i++) {

        setTimeout(() => {

            explosion(
                Math.random()*window.innerWidth,
                Math.random()*window.innerHeight
            );

        }, i * 50);

    }

    setTimeout(() => {

        document.getElementById("event").style.display =
            "none";

        document.body.classList.remove("chaos");

    }, 1400);

}


setInterval(() => {

    if(Math.random() < .5) {
        chaosEvent();
    }

}, 9000);


/* =====================================
   SLOPE GAME
===================================== */

const slope = document.getElementById("slope");
const ball = document.getElementById("ball");

let leftPressed = false;
let rightPressed = false;

document.addEventListener("keydown", e => {

    if(e.key === "ArrowLeft" || e.key === "a")
        leftPressed = true;

    if(e.key === "ArrowRight" || e.key === "d")
        rightPressed = true;

});

document.addEventListener("keyup", e => {

    if(e.key === "ArrowLeft" || e.key === "a")
        leftPressed = false;

    if(e.key === "ArrowRight" || e.key === "d")
        rightPressed = false;

});


function spawnObstacle() {

    const obstacle =
        document.createElement("div");

    obstacle.className =
        "slopeObstacle";

    obstacle.style.left =
        Math.random()*90 + "%";

    obstacle.style.top =
        "-50px";

    slope.appendChild(obstacle);

    obstacles.push({
        element: obstacle,
        x: parseFloat(obstacle.style.left),
        y: -50
    });

}


setInterval(spawnObstacle, 700);


function slopeLoop() {

    if(leftPressed)
        ballX -= 1.2;

    if(rightPressed)
        ballX += 1.2;

    ballX = Math.max(2, Math.min(94, ballX));

    ball.style.left = ballX + "%";

    for(let i = obstacles.length - 1; i >= 0; i--) {

        const o = obstacles[i];

        o.y += 4;

        o.element.style.top =
            o.y + "px";

        const ox =
            parseFloat(o.element.style.left);

        if(
            Math.abs(ox - ballX) < 7 &&
            Math.abs(o.y - 170) < 30
        ) {

            notify("💀 SLOPE BONK");

            cookies += 50;

            o.element.remove();

            obstacles.splice(i,1);

            explosion(
                window.innerWidth/2,
                window.innerHeight-100
            );

            updateUI();

        }

        if(o.y > 260) {

            o.element.remove();

            obstacles.splice(i,1);

        }

    }

    requestAnimationFrame(slopeLoop);

}

slopeLoop();


/* =====================================
   RANDOM SCREEN COLOR
===================================== */

setInterval(() => {

    document.body.style.filter =
        `hue-rotate(${Math.random()*360}deg)`;

}, 350);


/* =====================================
   CLICK ANYWHERE
===================================== */

document.addEventListener("click", e => {

    if(
        e.target.tagName !== "BUTTON" &&
        e.target.id !== "cookie" &&
        e.target.id !== "toilet"
    ) {

        if(Math.random() < .25) {

            floatText(
                "BRO CLICKED AIR 💀",
                e.clientX,
                e.clientY
            );

        }

    }

});


/* =====================================
   STARTUP
===================================== */

setTimeout(() => {

    notify("🧠 WELCOME TO THE BRAINROT ZONE");

}, 500);

setTimeout(() => {

    notify("⚠️ THERE IS NO ESCAPE");

}, 1500);

setTimeout(() => {

    notify("🍪 CLICK THE COOKIE");

}, 2500);

updateUI();

</script>

</body>
</html>
